name: Temporary aggregate student stats

on:
  push:
    branches:
      - tmp/student-stats-20260903
    paths:
      - .github/workflows/tmp-student-stats.yml

permissions:
  contents: read

jobs:
  stats:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install Firebase Admin
        run: npm install --no-save --ignore-scripts firebase-admin@13.4.0
      - name: Read aggregate classroom stats
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import admin from 'firebase-admin';

          const raw = process.env.FIREBASE_SERVICE_ACCOUNT || '';
          const projectId = process.env.FIREBASE_PROJECT_ID || '';
          if (!raw || !projectId) throw new Error('Firebase service credentials are unavailable');

          const serviceAccount = JSON.parse(raw);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            projectId,
          });
          const db = admin.firestore();
          const studentsSnap = await db.collection('students').get();
          const now = Date.now();
          const perPage = new Map();
          let withResults = 0;
          let withDrafts = 0;
          let totalResults = 0;
          let totalDrafts = 0;
          let active24h = 0;
          let active7d = 0;

          for (const studentDoc of studentsSnap.docs) {
            const profile = studentDoc.data() || {};
            const lastSeen = Number(profile.lastSeenAt || 0);
            if (lastSeen && now - lastSeen <= 24 * 60 * 60 * 1000) active24h++;
            if (lastSeen && now - lastSeen <= 7 * 24 * 60 * 60 * 1000) active7d++;

            const [resultsSnap, draftsSnap] = await Promise.all([
              studentDoc.ref.collection('results').get(),
              studentDoc.ref.collection('drafts').get(),
            ]);

            if (!resultsSnap.empty) withResults++;
            if (!draftsSnap.empty) withDrafts++;
            totalResults += resultsSnap.size;
            totalDrafts += draftsSnap.size;

            for (const resultDoc of resultsSnap.docs) {
              const r = resultDoc.data() || {};
              const page = Number(r.pageNumber || 0);
              if (!page) continue;
              const entry = perPage.get(page) || {
                page,
                submittedStudents: 0,
                latestScoreSum: 0,
                bestScoreSum: 0,
              };
              entry.submittedStudents++;
              entry.latestScoreSum += Number(r.latestScore ?? r.score ?? 0);
              entry.bestScoreSum += Number(r.bestScore ?? r.score ?? 0);
              perPage.set(page, entry);
            }

            for (const draftDoc of draftsSnap.docs) {
              const d = draftDoc.data() || {};
              if (d.submitted) continue;
              const page = Number(d.pageNumber || 0);
              if (!page) continue;
              const entry = perPage.get(page) || {
                page,
                submittedStudents: 0,
                latestScoreSum: 0,
                bestScoreSum: 0,
              };
              entry.activeDrafts = (entry.activeDrafts || 0) + 1;
              perPage.set(page, entry);
            }
          }

          const pages = [...perPage.values()]
            .sort((a, b) => a.page - b.page)
            .map((p) => ({
              page: p.page,
              submittedStudents: p.submittedStudents,
              activeDrafts: p.activeDrafts || 0,
              averageLatestScore: p.submittedStudents
                ? Math.round(p.latestScoreSum / p.submittedStudents)
                : null,
              averageBestScore: p.submittedStudents
                ? Math.round(p.bestScoreSum / p.submittedStudents)
                : null,
            }));

          const report = {
            registeredStudents: studentsSnap.size,
            studentsWithSubmittedWork: withResults,
            studentsWithDrafts: withDrafts,
            totalSubmittedPages: totalResults,
            totalDraftDocuments: totalDrafts,
            activeLast24Hours: active24h,
            activeLast7Days: active7d,
            pages,
          };

          console.log('STUDENT_STATS_BEGIN');
          console.log(JSON.stringify(report));
          console.log('STUDENT_STATS_END');
          NODE
