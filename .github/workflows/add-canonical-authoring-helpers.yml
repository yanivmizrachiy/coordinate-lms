name: Add canonical authoring helpers

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  add-helper:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - name: Insert the canonical printable color-grid helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/data/workbook/authoring.ts')
          text = path.read_text(encoding='utf-8')
          if 'export const colorGrid =' in text:
              print('colorGrid already exists.')
          else:
              anchor = '/** „מחסן מילים” — the words to choose from, so the task needs no explaining. */'
              helper = '''/** A labelled cell grid the learner COLOURS by hand — the printable stand-in
              for the colour-decode game. Columns x:0..xmax, rows y:0..ymax. `.color-grid`
              is `direction: ltr` so the origin sits bottom-LEFT and x grows to the right,
              exactly like every coordinate drawing in the booklet — the first quadrant,
              not a mirror of it. Plain spans, never a <button>: „המשימות שלנו הן
              להדפסה", and a printed page carries no widget. */
          export const colorGrid = (xmax: number, ymax: number): string => {
            const cols = xmax + 1;
            let body = '';
            for (let y = ymax; y >= 0; y--) {
              let row = `<span class="cg-lab cg-lab--y">${y}</span>`;
              for (let x = 0; x <= xmax; x++) row += `<span class="cg-cell" aria-label="תא ${x},${y}"></span>`;
              body += row;
            }
            let foot = '<span class="cg-lab"></span>';
            for (let x = 0; x <= xmax; x++) foot += `<span class="cg-lab cg-lab--x">${x}</span>`;
            return (
              `<div class="color-grid" role="img" aria-label="רשת תאים לצביעה" ` +
              `style="--cg-cols:${cols}">${body}${foot}</div>`
            );
          };

          '''
              if anchor not in text:
                  raise SystemExit('Expected wordBank anchor was not found.')
              path.write_text(text.replace(anchor, helper + anchor), encoding='utf-8')
          PY
      - name: Commit the helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/workbook/authoring.ts
          if git diff --cached --quiet; then
            echo "No authoring change required."
          else
            git commit -m "sync: add canonical printable color-grid helper"
            git push origin HEAD:agent/sync-latest-workbook
          fi
