name: Sync canonical workbook into audit branch

on:
  push:
    branches:
      - agent/digital-answer-audit

permissions:
  contents: write

concurrency:
  group: sync-canonical-workbook-audit
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LMS audit branch
        uses: actions/checkout@v7
        with:
          ref: agent/digital-answer-audit
          path: lms
      - name: Checkout canonical printed workbook read-only
        uses: actions/checkout@v7
        with:
          repository: yanivmizrachiy/coordinate-first-quadrant
          ref: main
          path: canonical
          persist-credentials: false
      - name: Copy canonical workbook exactly
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha="$(git -C canonical rev-parse HEAD)"
          rm -rf lms/src/data/workbook
          mkdir -p lms/src/data
          cp -a canonical/src/data/workbook lms/src/data/workbook
          cat > lms/reports/canonical-workbook-source.md <<EOF
          # Canonical workbook source

          Synced: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          - Source repository: \`yanivmizrachiy/coordinate-first-quadrant\`
          - Source branch: \`main\`
          - Source commit: \`$canonical_sha\`
          - Policy: read-only source; the LMS copies canonical workbook content and adds interactivity outside \`src/data/workbook\`.
          EOF
      - name: Commit synchronized workbook
        working-directory: lms
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/workbook reports/canonical-workbook-source.md
          if git diff --cached --quiet; then
            echo "Canonical workbook already synchronized."
            exit 0
          fi
          git commit -m "Sync canonical 78-page workbook"
          git push
