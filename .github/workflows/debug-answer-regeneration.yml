name: Capture answer regeneration result

on:
  push:
    branches:
      - agent/digital-answer-audit

permissions:
  contents: write

concurrency:
  group: capture-answer-regeneration-result
  cancel-in-progress: true

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/digital-answer-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run generator and capture result
        shell: bash
        run: |
          set +e
          npm run answers:coverage > reports/answer-regeneration.log 2>&1
          status=$?
          set -e
          {
            echo
            echo "EXIT_STATUS=$status"
          } >> reports/answer-regeneration.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/answer-regeneration.log reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Capture canonical answer regeneration"
            git push
          fi
