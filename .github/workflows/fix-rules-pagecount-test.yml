name: Fix RULES page-count regression

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - '.github/workflows/fix-rules-pagecount-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0
      - name: Match the current RULES.md wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/layout-rules.test.ts')
          text = path.read_text(encoding='utf-8')
          old = "const stated = /\\*\\*החוברת = (\\d+) עמודים ממוספרים\\*\\*/.exec(rules)?.[1];"
          new = "const stated = /contains \\*\\*(\\d+) numbered pages\\*\\*/.exec(rules)?.[1];"
          old_loop = "for (const m of rules.matchAll(/(\\d+) עמודים ממוספרים/g)) {"
          new_loop = "for (const m of rules.matchAll(/\\*\\*(\\d+) numbered pages\\*\\*/g)) {"
          if text.count(old) != 1 or text.count(old_loop) != 1:
              raise SystemExit('guard failed: page-count parser drifted')
          text = text.replace(old, new, 1).replace(old_loop, new_loop, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/layout-rules.test.ts
          git commit -m 'Align rules page-count regression with RULES.md'
          git push origin HEAD:agent/canonical-lms-unified
