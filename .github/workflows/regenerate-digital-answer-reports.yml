name: Regenerate digital answer evidence

on:
  push:
    branches:
      - agent/digital-answer-audit

permissions:
  contents: write

concurrency:
  group: regenerate-digital-answer-evidence
  cancel-in-progress: true

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/digital-answer-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run answers:coverage
      - name: Commit generated evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          if git diff --cached --quiet; then
            echo "Generated evidence already current."
            exit 0
          fi
          git commit -m "Refresh digital answer evidence"
          git push
