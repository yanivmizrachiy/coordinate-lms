name: Cleanup retired authority and generators

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - '.github/workflows/cleanup-retired-authority.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0
      - name: Remove retired generators and authority drift
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          removable = [Path('scripts/upgrade-lms-phase2.mjs'), Path('scripts/phase3-extreme-generate.mjs'), Path('MIGRATION_STATUS.md'), Path('USER_MEMORY.md')]
          required = removable + [Path('tests/workbook.test.ts'), Path('tests/layout-rules.test.ts')]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit('guard failed; missing: ' + ', '.join(missing))
          workbook = Path('tests/workbook.test.ts')
          text = workbook.read_text(encoding='utf-8')
          old = "describe('workbook integrity (USER_MEMORY.md mandatory checks)', () => {"
          if text.count(old) != 1:
              raise SystemExit('guard failed: workbook authority label drifted')
          text = text.replace(old, "describe('workbook integrity (RULES.md canonical checks)', () => {", 1)
          if 'USER_MEMORY' in text:
              raise SystemExit('guard failed: workbook still references USER_MEMORY')
          workbook.write_text(text, encoding='utf-8')
          layout = Path('tests/layout-rules.test.ts')
          text = layout.read_text(encoding='utf-8')
          text = text.replace("/* Yaniv's standing layout rules, as executable checks.", '/* Canonical layout invariants as executable regression checks.')
          text = re.sub(r'USER_MEMORY §\d+', 'regression invariant', text)
          if 'USER_MEMORY' in text:
              raise SystemExit('guard failed: layout still references USER_MEMORY')
          layout.write_text(text, encoding='utf-8')
          for path in removable:
              path.unlink()
          PY
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Remove retired generators and duplicate authority files'
          git push origin HEAD:agent/canonical-lms-unified
