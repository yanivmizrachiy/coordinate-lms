name: Add page 42 dependent predicate

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - '.github/workflows/add-page42-dependent-predicate.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0
      - name: Add one atomic mathematical predicate for page 42
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          predicates = Path('src/lms/digitalPredicates.ts')
          text = predicates.read_text(encoding='utf-8')

          old_union = "  | 'rectangle-from-corner-4x3'\n  | 'nonnegative-number';"
          new_union = "  | 'rectangle-from-corner-4x3'\n  | 'point-on-x-axis-moved-up-4'\n  | 'nonnegative-number';"
          if text.count(old_union) != 1:
              raise SystemExit('guard failed: predicate union drifted')
          text = text.replace(old_union, new_union, 1)

          old_eval = """  if (rule === 'nonnegative-number') {
    if (values.length !== 1) return false;
    const value = finiteNumber(values[0] || '');
    return value !== null && value >= 0;
  }

  if (rule === 'same-x-coordinate-pairs') {"""
          new_eval = """  if (rule === 'nonnegative-number') {
    if (values.length !== 1) return false;
    const value = finiteNumber(values[0] || '');
    return value !== null && value >= 0;
  }

  if (rule === 'point-on-x-axis-moved-up-4') {
    if (values.length !== 5) return false;
    const numbers = numericValues(values);
    if (!numbers) return false;
    const [gx, gy, movedX, movedY, distance] = numbers as [number, number, number, number, number];
    return gx >= 0 && gx <= 8 && gy === 0 && movedX === gx && movedY === 4 && distance === 4;
  }

  if (rule === 'same-x-coordinate-pairs') {"""
          if text.count(old_eval) != 1:
              raise SystemExit('guard failed: evaluator insertion point drifted')
          text = text.replace(old_eval, new_eval, 1)

          old_hydrate = """    const heading = normalizedText(card.querySelector('h3'));
    const cardText = normalizedText(card);

    if (
      heading.includes('מזהים קודקודים') &&"""
          new_hydrate = """    const heading = normalizedText(card.querySelector('h3'));
    const cardText = normalizedText(card);

    if (
      heading.includes('סמנו נקודה משלכם') &&
      cardText.includes('נקודה G') &&
      cardText.includes('שממוקמת על ציר x') &&
      cardText.includes('4 יחידות למעלה') &&
      cardText.includes('המרחק שלה מציר x')
    ) {
      const pairTargets = Array.from(card.querySelectorAll<HTMLElement>('.pair-blank'));
      const distanceTarget = card.querySelector<HTMLElement>('.blank[data-missing=\"number\"]');
      const targets = distanceTarget ? [...pairTargets, distanceTarget] : [];
      if (targets.length === 5 && targets.every((target) => !target.dataset['lmsGroup'])) {
        ordinal += 1;
        const binding = bindGroupPredicate(
          proxyHost,
          targets,
          'point-on-x-axis-moved-up-4',
          'בדיקה מתמטית של G על ציר x, הזזה 4 יחידות למעלה והמרחק הנגזר',
          ordinal,
        );
        if (binding) bindings.push(binding);
      }
    }

    if (
      heading.includes('מזהים קודקודים') &&"""
          if text.count(old_hydrate) != 1:
              raise SystemExit('guard failed: hydration insertion point drifted')
          text = text.replace(old_hydrate, new_hydrate, 1)
          predicates.write_text(text, encoding='utf-8')

          grouped = Path('src/lms/groupCoverageBindings.ts')
          text = grouped.read_text(encoding='utf-8')
          old_group = """  if (pageNumber !== 54) return null;

  if (/^p54-q[1-4]$/.test(targetId)) {"""
          new_group = """  if (pageNumber === 42 && /^p42-q1[2-6]$/.test(targetId)) {
    return 'point-on-x-axis-moved-up-4';
  }

  if (pageNumber !== 54) return null;

  if (/^p54-q[1-4]$/.test(targetId)) {"""
          if text.count(old_group) != 1:
              raise SystemExit('guard failed: group coverage insertion point drifted')
          grouped.write_text(text.replace(old_group, new_group, 1), encoding='utf-8')

          test_path = Path('tests/coordinate-safe-predicate.test.ts')
          if test_path.exists():
              raise SystemExit('guard failed: coordinate-safe predicate test already exists')
          test_path.write_text("""import { parseHTML } from 'linkedom';
import { describe, expect, it } from 'vitest';
import { WORKBOOK } from '../src/data/workbook';
import { answersMatch } from '../src/lms/answerValidation';
import {
  evaluateDigitalGroupRule,
  hydrateDigitalPredicates,
} from '../src/lms/digitalPredicates';
import { canonicalGroupRuleForCoverage } from '../src/lms/groupCoverageBindings';

function canonicalPage42Root(): HTMLElement {
  const page = WORKBOOK.find((candidate) => candidate.n === 42);
  expect(page).toBeDefined();
  const { document, window } = parseHTML(`<div id=\"root\">${page!.html}</div>`);
  Object.assign(globalThis, {
    Node: window.Node,
    HTMLElement: window.HTMLElement,
    MutationObserver: window.MutationObserver,
    Event: window.Event,
    document,
    window,
  });
  const root = document.querySelector<HTMLElement>('#root');
  expect(root).not.toBeNull();
  return root!;
}

describe('page 42 dependent coordinate-safe predicate', () => {
  it('accepts every legal G on x-axis and derives the moved point and distance', () => {
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['3', '0', '3', '4', '4'])).toBe(true);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['0', '0', '0', '4', '4'])).toBe(true);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['8', '0', '8', '4', '4'])).toBe(true);
    expect(answersMatch('5|0|5|4|4', ['predicate:point-on-x-axis-moved-up-4'])).toBe(true);
  });

  it('rejects a point off x-axis, changed x, wrong rise, wrong distance, or off-grid x', () => {
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['3', '1', '3', '5', '5'])).toBe(false);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['3', '0', '4', '4', '4'])).toBe(false);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['3', '0', '3', '5', '5'])).toBe(false);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['3', '0', '3', '4', '3'])).toBe(false);
    expect(evaluateDigitalGroupRule('point-on-x-axis-moved-up-4', ['9', '0', '9', '4', '4'])).toBe(false);
  });

  it('binds the five canonical dependent fields to exactly one runtime proxy', () => {
    const root = canonicalPage42Root();
    const cleanup = hydrateDigitalPredicates(root);
    const proxies = Array.from(root.querySelectorAll<HTMLElement>(
      '.lms-group-proxy[data-lms-group^=\"point-on-x-axis-moved-up-4-\"]',
    ));
    expect(proxies).toHaveLength(1);
    const group = proxies[0]!.dataset['lmsGroup'];
    expect(group).toBeTruthy();
    expect(root.querySelectorAll(`[data-lms-group=\"${group}\"]:not(.lms-group-proxy)`)).toHaveLength(5);
    expect(proxies[0]!.dataset['lmsAnswers']).toBe(
      JSON.stringify(['predicate:point-on-x-axis-moved-up-4']),
    );
    cleanup();
  });

  it('connects exactly canonical targets p42-q12 through p42-q16 to coverage', () => {
    for (let q = 12; q <= 16; q += 1) {
      expect(canonicalGroupRuleForCoverage(42, `p42-q${q}`)).toBe('point-on-x-axis-moved-up-4');
    }
    expect(canonicalGroupRuleForCoverage(42, 'p42-q11')).toBeNull();
    expect(canonicalGroupRuleForCoverage(42, 'p42-q17')).toBeNull();
  });
});
""", encoding='utf-8')
          PY

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lms/digitalPredicates.ts src/lms/groupCoverageBindings.ts tests/coordinate-safe-predicate.test.ts
          git commit -m 'Check dependent page 42 point movement mathematically'
          git push origin HEAD:agent/canonical-lms-unified
