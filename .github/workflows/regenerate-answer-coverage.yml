name: Apply workbook synchronization

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded page and test migration
        run: node scripts/apply-workbook-sync.mjs
      - name: Generate current answer coverage
        run: npm run answers:coverage
      - name: Commit synchronized sources and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lms/answerCoverage.ts tests/workbook.test.ts tests/layout-rules.test.ts tests/answer-coverage.test.ts README.md RULES.md reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          if git diff --cached --quiet; then
            echo "Synchronized sources and reports are already current."
          else
            git commit -m "lms: migrate answer identities to the 78-page workbook"
            git push origin HEAD:agent/sync-latest-workbook
          fi
