name: Regenerate answer coverage

on:
  push:
    branches:
      - fix/deterministic-computerized-grading
    paths:
      - .github/workflows/regenerate-answer-coverage.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run answers:coverage
      - name: Commit generated coverage artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          if git diff --cached --quiet; then
            echo "Coverage artifacts already current."
            exit 0
          fi
          git commit -m "chore: regenerate answer coverage"
          git push
