name: Fix rules regression source

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - '.github/workflows/fix-rules-test-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0
      - name: Point rules drift test at RULES.md
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/layout-rules.test.ts')
          text = path.read_text(encoding='utf-8')
          old_path = "new URL('../regression history', import.meta.url)"
          if text.count(old_path) != 1:
              raise SystemExit('guard failed: expected retired rules path exactly once')
          text = text.replace(old_path, "new URL('../RULES.md', import.meta.url)", 1)
          text = text.replace('/* regression history is the single rules page,', '/* RULES.md is the single rules page,', 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/layout-rules.test.ts
          git commit -m 'Point rules drift regression at RULES.md'
          git push origin HEAD:agent/canonical-lms-unified
