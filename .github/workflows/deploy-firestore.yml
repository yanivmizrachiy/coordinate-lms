name: Deploy Firestore rules (manual)

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: firestore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate deployment credentials and ref
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "branch" ]]; then
            echo "::error::Production Firestore deployment must run from a branch, not a tag"
            exit 1
          fi

          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID secret is missing"
            exit 1
          fi

          if [[ "$FIREBASE_PROJECT_ID" == demo-* ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID must reference a real non-demo Firebase project"
            exit 1
          fi

          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
      - name: Prepare Firebase service account
        shell: bash
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          chmod 600 "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
      - name: Deploy rules and indexes
        run: >-
          npx --yes firebase-tools@15.25.1 deploy
          --only firestore:rules,firestore:indexes
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
      - name: Verify Firebase Authentication and deployment evidence
        run: node scripts/verify-production-firebase.mjs
      - name: Keep non-secret production Firebase evidence artifact
        uses: actions/upload-artifact@v7
        with:
          name: firebase-production-evidence
          path: reports/firebase-production-evidence.json
          retention-days: 30
      - name: Persist verified non-secret evidence to the triggering branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/firebase-production-evidence.json

          if git diff --cached --quiet; then
            echo "Production Firebase evidence is already current."
            exit 0
          fi

          git commit -m "Record verified Firebase production evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          # Pushes made with GITHUB_TOKEN do not start ordinary push-triggered
          # workflows. Explicitly dispatch CI so the new evidence commit receives
          # the same full verification gates required before release.
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
