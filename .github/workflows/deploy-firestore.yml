name: Deploy Firestore rules (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Validate deployment credentials
        shell: bash
        run: |
          if [[ -z "$FIREBASE_PROJECT_ID" ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID secret is missing"
            exit 1
          fi

          if [[ "$FIREBASE_PROJECT_ID" == demo-* ]]; then
            echo "::error::VITE_FIREBASE_PROJECT_ID must reference a real non-demo Firebase project"
            exit 1
          fi

          if [[ -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi
      - name: Prepare Firebase service account
        shell: bash
        run: |
          credentials="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credentials"
          chmod 600 "$credentials"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials" >> "$GITHUB_ENV"
      - name: Deploy rules and indexes
        run: >-
          npx --yes firebase-tools@15.25.1 deploy
          --only firestore:rules,firestore:indexes
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
      - name: Verify Firebase Authentication and deployment evidence
        run: node scripts/verify-production-firebase.mjs
      - name: Keep non-secret production Firebase evidence
        uses: actions/upload-artifact@v7
        with:
          name: firebase-production-evidence
          path: reports/firebase-production-evidence.json
          retention-days: 30
