name: Reconcile synchronized workbook metadata

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - name: Replace the stale historical project state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('USER_MEMORY.md')
          text = path.read_text(encoding='utf-8')
          old = '''- **החוברת = 77 עמודים ממוספרים** = 66 דפי עבודה + 7 שעשועונים אינטראקטיביים
            (שעשועון „מילת הסוד" המקוון הוחלף בדף המודפס **„מילת הצופן"** — 30.07.2026)
            + 4 שעשועוני פוסטר מעוצבים,
            **ועוד עמוד שער** שאינו ממוספר ואינו נספר.
          - מקורות התוכן: `src/data/workbook/pages/` — **קובץ אחד לכל עמוד**, בשם שמתאר
            מה העמוד מלמד; `src/games/` (7 שעשועונים).'''
          new = '''- **החוברת = 78 עמודים ממוספרים** — כל העמודים הם דפי עבודה קנוניים
            הניתנים להדפסה. שמונת השעשועונים הישנים אינם מחליפים עוד עמודי חוברת;
            שכבת ה־LMS מוסיפה מענה, שמירה ובדיקה מעל הדפים בלי לשנות את תוכן ההדפסה.
            **ועוד עמוד שער ותוכן עניינים** שאינם חלק ממספור 1–78.
          - מקורות התוכן: `src/data/workbook/pages/` — **קובץ אחד לכל עמוד**, בשם שמתאר
            מה העמוד מלמד. `src/games/` נשמר רק כקוד ונתוני חידות היסטוריים ואינו
            מורכב לתוך רצף העמודים הממוספרים.'''
          if old not in text:
              raise SystemExit('The expected stale USER_MEMORY project-state block was not found.')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit the reconciled archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add USER_MEMORY.md
          git commit -m "docs: reconcile archived workbook state to 78 pages"
          git push origin HEAD:agent/sync-latest-workbook
