name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout canonical printable source (read-only)
        uses: actions/checkout@v7
        with:
          repository: yanivmizrachiy/coordinate-first-quadrant
          ref: main
          path: .canonical-print-source
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Canonical printable/LMS synchronization gate
        shell: bash
        run: |
          set +e
          output="$(node scripts/check-canonical-source.mjs .canonical-print-source 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            escaped="${output//'%'/'%25'}"
            escaped="${escaped//$'\r'/'%0D'}"
            escaped="${escaped//$'\n'/'%0A'}"
            echo "::error title=Canonical printable/LMS synchronization failed::$escaped"
            exit "$status"
          fi
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Development toolchain security gate
        run: npm audit --audit-level=high
      - name: Generated answer coverage is current
        run: npm run answers:coverage:check
      - name: Firebase launch contract (static)
        run: npm run firebase:check:static
      - name: Typecheck
        run: npm run typecheck
      - name: Firestore emulator authorization tests
        run: npm run test:firestore
      - name: Separated classroom release contract
        run: npm run release:report:static
      - name: Unit & content tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Keep readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports
          path: |
            reports/answer-coverage.json
            reports/answer-coverage.md
            reports/answer-target-order.json
            reports/firebase-readiness.json
            reports/firebase-readiness.md
            reports/firestore-emulator.json
            reports/release-readiness.json
            reports/release-readiness.md
          retention-days: 14

  visual-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Measured checks (A4 layout, sizes, Hebrew direction, 13px)
        run: npm run test:visual
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
