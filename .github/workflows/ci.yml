name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Development toolchain security gate
        run: npm audit --audit-level=high
      - name: Generated answer coverage is current
        run: npm run answers:coverage:check
      - name: Firebase launch contract (static)
        run: npm run firebase:check:static
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & content tests
        run: npm test
      - name: Firestore emulator authorization tests
        run: npm run test:firestore
      - name: Generate classroom readiness evidence
        if: always()
        continue-on-error: true
        run: npm run release:report:static
      - name: Build
        run: npm run build
      - name: Keep readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports
          path: |
            reports/answer-coverage.json
            reports/answer-coverage.md
            reports/answer-target-order.json
            reports/firebase-readiness.json
            reports/firebase-readiness.md
            reports/firestore-emulator.json
            reports/release-readiness.json
            reports/release-readiness.md
          retention-days: 14

  # Render-dependent rules are checked in a real browser so layout regressions
  # cannot hide behind successful unit tests.
  visual-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Measured checks (A4 layout, sizes, Hebrew direction, 13px)
        run: npm run test:visual
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  capture-page12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and capture page 12
        run: |
          VITE_ALLOW_LOCAL_LMS=true npm run build
          npm run preview > /tmp/coordinate-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4319/ >/dev/null; then break; fi
            sleep 1
          done
          npx playwright screenshot --browser chromium --viewport-size "1440,1800" --full-page "http://127.0.0.1:4319/#/workbook/12" page12-after-fix.png
          test -s page12-after-fix.png
      - name: Upload page 12 screenshot
        uses: actions/upload-artifact@v7
        with:
          name: page12-after-fix
          path: page12-after-fix.png
          retention-days: 1