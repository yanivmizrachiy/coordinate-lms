name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: write

jobs:
  record-ssot-decisions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref_name || github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Record approved page decisions in RULES
        run: |
          node scripts/tmp-record-page-decisions.cjs
          npm test -- --run tests/ssot-guard.test.ts tests/layout-rules.test.ts tests/solutions.test.ts
      - name: Commit verified SSOT update on branch push
        if: github.event_name == 'push'
        run: |
          if git diff --quiet; then
            echo 'SSOT already synchronized.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RULES.md
          git commit -m "docs: record approved page 11 and 12 decisions"
          git push

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - name: Set up Java for the Firestore emulator
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Production dependency security gate
        run: npm audit --omit=dev --audit-level=high
      - name: Development toolchain security gate
        run: npm audit --audit-level=high
      - name: Generated answer coverage is current
        run: npm run answers:coverage:check
      - name: Firebase launch contract (static)
        run: npm run firebase:check:static
      - name: Typecheck
        run: npm run typecheck
      - name: Unit & content tests
        run: npm test
      - name: Firestore emulator authorization tests
        run: npm run test:firestore
      - name: Generate classroom readiness evidence
        if: always()
        continue-on-error: true
        run: npm run release:report:static
      - name: Build
        run: npm run build
      - name: Keep readiness evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: readiness-reports
          path: |
            reports/answer-coverage.json
            reports/answer-coverage.md
            reports/answer-target-order.json
            reports/firebase-readiness.json
            reports/firebase-readiness.md
            reports/firestore-emulator.json
            reports/release-readiness.json
            reports/release-readiness.md
          retention-days: 14

  # Render-dependent rules are checked in a real browser so layout regressions
  # cannot hide behind successful unit tests.
  visual-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Measured checks (A4 layout, sizes, Hebrew direction, 13px)
        run: npm run test:visual
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
