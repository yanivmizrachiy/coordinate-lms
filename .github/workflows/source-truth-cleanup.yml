name: One-shot source-truth cleanup

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - .github/workflows/source-truth-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0

      - name: Remove contradictory active-code language
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:80]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_exact(
              'src/views/lmsKeys.ts',
              "  'open-ended': 'פתוח להערכת מורה',",
              "  'open-ended': 'דורש התאמה דיגיטלית אובייקטיבית',",
          )
          replace_exact(
              'src/views/lmsKeys.ts',
              "  'intentionally-ungraded': 'לא מדורג במכוון',",
              "  'intentionally-ungraded': 'לא מדורג רק לאחר סקירה פדגוגית',",
          )
          replace_exact(
              'src/views/lmsKeys.ts',
              "          'כל 1,061 היעדים מגיעים מדוח הכיסוי המופק. אפשר לסנן, לייצא עבודה מלאה, לסקור באצווה ולייבא לתצוגה מקדימה לפני הפעלה.',",
              "          'כל יעדי המענה מגיעים מדוח הכיסוי המופק מהחוברת הקנונית. אפשר לסנן, לייצא עבודה מלאה, לסקור באצווה ולייבא לתצוגה מקדימה לפני הפעלה.',",
          )
          replace_exact(
              'src/views/lmsKeys.ts',
              "        throw new Error('מניפסט סקירת התשובות אינו תואם ל־77 העמודים.');",
              "        throw new Error('מניפסט סקירת התשובות אינו תואם למספר העמודים הקנוני.');",
          )
          replace_exact(
              'src/views/home.ts',
              "   quadrant, its film, and the 77-page booklet.",
              "   quadrant, its film, and the canonical printable-synchronized booklet.",
          )
          replace_exact(
              'src/lms/answerCoverage.ts',
              "      currentAnswerSource: 'teacher judgment required',",
              "      currentAnswerSource: 'objective digital adaptation required',",
          )

          p = Path('src/lms/answerCoverage.ts')
          text = p.read_text(encoding='utf-8')
          needle = "  const reviewedOpenEndedSignature =\n    REVIEWED_OPEN_ENDED_TARGET_SIGNATURES[lookupTargetId];\n"
          if text.count(needle) != 1:
              raise SystemExit('answerCoverage.ts: reviewed-open-ended insertion point changed')
          insertion = """  if (/הסבירו|ההסבר|נמקו|מדוע/.test(context)) {\n    return {\n      classification: 'ambiguous',\n      currentAnswerSource: 'four-option pedagogical digital adaptation required',\n      sourceEvidence: 'RULES.md §6: explanation task must be objectively computerized',\n      automaticCheckingSafe: false,\n      answers: [],\n    };\n  }\n\n"""
          text = text.replace(needle, insertion + needle, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Verify forbidden active phrases are gone
        shell: bash
        run: |
          ! grep -R -n --exclude-dir=_legacy --exclude='source-truth-cleanup.yml' -E 'teacher judgment required|פתוח להערכת מורה|1,061 היעדים|77 העמודים|77-page booklet' src README.md CLAUDE.md HANDOFF.md docs

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/views/lmsKeys.ts src/views/home.ts src/lms/answerCoverage.ts
          git diff --cached --check
          git commit -m "Remove contradictory legacy source-truth assumptions"
          git pull --rebase origin agent/canonical-lms-unified
          git push origin HEAD:agent/canonical-lms-unified
