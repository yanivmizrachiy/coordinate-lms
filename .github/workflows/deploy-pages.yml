# Manual-only deploy to GitHub Pages. This NEVER runs automatically — it fires
# solely when a maintainer triggers it from the Actions tab (workflow_dispatch),
# so nothing is published without an explicit human action.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:
    inputs:
      guest_preview:
        description: >-
          Publish a GUEST-ONLY site even without Firebase. Guests solve every
          page, receive feedback and a temporary score, but scores are not
          saved. Registration stays fail-closed until the six Firebase secrets
          are added. Leave false for a full classroom release.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_ADMIN_EMAILS: ${{ vars.VITE_ADMIN_EMAILS || 'yanivmiz77@gmail.com' }}
      VITE_ALLOW_LOCAL_LMS: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate central LMS configuration
        shell: bash
        run: |
          required=(
            VITE_FIREBASE_API_KEY
            VITE_FIREBASE_AUTH_DOMAIN
            VITE_FIREBASE_PROJECT_ID
            VITE_FIREBASE_STORAGE_BUCKET
            VITE_FIREBASE_MESSAGING_SENDER_ID
            VITE_FIREBASE_APP_ID
          )

          missing=0
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Firebase setting::$name is not configured in repository Actions secrets"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            if [[ "${{ inputs.guest_preview }}" == "true" ]]; then
              echo "::warning title=Guest-only publish::Firebase is not configured — publishing a GUEST-ONLY site. Every page is solvable, feedback is available and a temporary score may be shown, but guest scores are not saved. Draft/attempt state may stay on this device to preserve the three-attempt model. Registration remains fail-closed and will refuse until the six Firebase secrets are added. This is NOT a full classroom release."
            else
              echo "Deployment stopped: central registration must be configured before publishing."
              echo "To publish a guest-only site now, re-run this workflow with guest_preview = true."
              exit 1
            fi
          fi
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5
