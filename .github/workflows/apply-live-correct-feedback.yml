name: Apply immediate LMS correctness feedback

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  apply-live-feedback:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Connect positive-only immediate feedback
        run: node scripts/add-live-correct-feedback.mjs
      - name: Commit LMS-only feedback change
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lms/engine.ts
          if git diff --cached --quiet; then
            echo "LMS live feedback is already connected."
          else
            git commit -m "lms: show correct answers immediately"
            git push origin HEAD:agent/sync-latest-workbook
          fi
