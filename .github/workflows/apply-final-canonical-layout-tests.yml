name: Apply canonical E2E and adaptive A4 migration

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  apply-browser-migration:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Update canonical browser checks and adaptive A4 handling
        run: node scripts/fix-canonical-e2e-and-overflow.mjs
      - name: Commit LMS infrastructure and test migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            tests/e2e/lms-accessibility.spec.ts \
            tests/e2e/lms-implicit-answers.spec.ts \
            tests/e2e/lms-reliability.spec.ts \
            tests/e2e/classroom-simulation.spec.ts \
            tests/e2e/smoke.spec.ts \
            src/lib/fitSheet.ts \
            src/styles/workbook.css
          if git diff --cached --quiet; then
            echo "Canonical browser checks and A4 handling are already current."
          else
            git commit -m "test: align browser checks with canonical LMS workbook"
            git push origin HEAD:agent/sync-latest-workbook
          fi
