name: Remove completed migration tools

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - name: Remove one-shot synchronization workflows and scripts
        shell: bash
        run: |
          git rm -f \
            .github/workflows/add-canonical-authoring-helpers.yml \
            .github/workflows/apply-canonical-sync-test-patch.yml \
            .github/workflows/audit-canonical-parity.yml \
            .github/workflows/fix-sync-metadata.yml \
            .github/workflows/regenerate-answer-coverage.yml \
            .github/workflows/sync-canonical-calc-box.yml \
            .github/workflows/sync-canonical-pages.yml \
            .github/workflows/apply-live-correct-feedback.yml \
            .github/workflows/apply-final-canonical-layout-tests.yml \
            scripts/apply-workbook-sync.mjs \
            scripts/patch-canonical-sync-tests.mjs \
            scripts/add-live-correct-feedback.mjs \
            scripts/fix-final-canonical-layout-tests.mjs \
            scripts/fix-canonical-e2e-and-overflow.mjs \
            scripts/fix-live-key-and-a4-overflow.mjs
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove completed workbook migration tools"
          git push origin HEAD:agent/sync-latest-workbook
