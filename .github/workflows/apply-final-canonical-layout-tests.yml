name: Apply live-key fallback and A4 overflow fix

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  apply-final-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Update immediate-key fallback and adaptive A4 handling
        run: node scripts/fix-live-key-and-a4-overflow.mjs
      - name: Commit LMS infrastructure fix only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lms/engine.ts src/styles/workbook.css
          if git diff --cached --quiet; then
            echo "Live-key fallback and A4 overflow recovery are already current."
          else
            git commit -m "fix: load immediate answer keys before repository hydration"
            git push origin HEAD:agent/sync-latest-workbook
          fi
