name: Apply canonical synchronization test patch

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  patch-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply guarded test expectation updates
        run: node scripts/patch-canonical-sync-tests.mjs
      - name: Commit updated tests
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/answer-coverage.test.ts tests/layout-rules.test.ts
          if git diff --cached --quiet; then
            echo "Canonical synchronization tests are already current."
          else
            git commit -m "test: align assertions with canonical workbook format"
            git push origin HEAD:agent/sync-latest-workbook
          fi
