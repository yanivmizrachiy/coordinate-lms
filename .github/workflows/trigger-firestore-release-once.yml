name: Trigger verified Firebase production release once

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - .github/workflows/trigger-firestore-release-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official Firestore production workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-firestore.yml -R yanivmizrachiy/coordinate-lms --ref agent/canonical-lms-unified
