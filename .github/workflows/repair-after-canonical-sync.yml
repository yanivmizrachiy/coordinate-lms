name: Repair LMS after canonical sync

on:
  push:
    branches:
      - agent/digital-answer-audit

permissions:
  contents: write

concurrency:
  group: repair-after-canonical-sync
  cancel-in-progress: true

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/digital-answer-audit
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Update active LMS page bounds to 78
        shell: bash
        run: |
          set -euo pipefail
          perl -0pi -e 's/pageNumber > 77/pageNumber > 78/g' src/lms/repository.ts
          perl -0pi -e 's/Math\.min\(\(latestResult\?\.pageNumber \|\| 0\) \+ 1, 77\)/Math.min((latestResult?.pageNumber || 0) + 1, 78)/g; s/pageNumber <= 77/pageNumber <= 78/g' src/lms/dashboardCsv.ts
          perl -0pi -e 's/value <= 77/value <= 78/g' firestore.rules
      - name: Generate current 78-page answer map
        shell: bash
        run: |
          set +e
          npm run answers:coverage > reports/answer-regeneration.log 2>&1
          generator_status=$?
          set -e
          {
            echo
            echo "GENERATOR_EXIT_STATUS=$generator_status"
            echo
            echo '## Remaining hard-coded 77 references in active paths'
            grep -RInE '(^|[^0-9])77([^0-9]|$)' src/lms src/views tests scripts firestore.rules package.json 2>/dev/null || true
          } >> reports/answer-regeneration.log
      - name: Commit repair evidence
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lms/repository.ts src/lms/dashboardCsv.ts firestore.rules reports/answer-regeneration.log reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Repair LMS for canonical 78-page workbook"
          git push
