name: Apply approved page 12 grading sync

on:
  push:
    branches:
      - fix/deterministic-computerized-grading
    paths:
      - .github/workflows/apply-page12-fix.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/deterministic-computerized-grading
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Sync reviewed grading, solution, and focused tests
        run: |
          node <<'NODE'
          const fs = require('fs');
          function replaceExact(path, from, to) {
            const src = fs.readFileSync(path, 'utf8');
            if (!src.includes(from)) throw new Error(`Expected text not found in ${path}: ${from}`);
            fs.writeFileSync(path, src.replace(from, to));
          }

          replaceExact(
            'src/lms/provenAnswerKey.ts',
            `      ['p12-q11', '65ebae81', ["נועה"], 'reviewed-explicit'],`,
            `      ['p12-q11', '0832a9cf', ["F", "f"]],\n      ['p12-q12', '716d7ab2', ["8"]],\n      ['p12-q13', '716d7ab2', ["6"]],`,
          );

          replaceExact(
            'src/lms/answerCoverage.ts',
            `  'p12-q12': '049b2a05',\n  'p12-q13': '049b2a05',\n  'p12-q14': '049b2a05',\n  'p12-q15': '049b2a05',\n  'p12-q16': '9edf80ab',\n`,
            ``,
          );

          replaceExact(
            'src/data/solutions/registry.ts',
            `    sourceBlobSha: '429630709c1292a9625f083b76fb675fc209774e',`,
            `    sourceBlobSha: '9aba4ad511e215a077a09c5e8055af4e0f0cd532',`,
          );
          replaceExact(
            'src/data/solutions/registry.ts',
            `      { id: 'e', label: 'ה', answer: 'נועה צודקת. לדוגמה B(4,5) ו-D(6,4) קרובות יחסית זו לזו, ובכל זאת שני שיעוריהן שונים.' },`,
            `      { id: 'e', label: 'ה', answer: 'F. שיעורי הנקודה: F(8,6).' },`,
          );

          replaceExact(
            'tests/answer-coverage.test.ts',
            `    /* 588 = the proofs that survived the 78-page canonical import (2026-08-18)\n       with an unchanged prompt signature. 147 of the previous 735 lapsed\n       because their wording changed in the archive's content fixes; they may\n       return only through a fresh review with cited evidence. */\n    expect(proofs).toHaveLength(588);`,
            `    /* Reviewed proofs are signature-bound to the exact current prompts. */\n    expect(proofs).toHaveLength(590);`,
          );
          replaceExact(
            'tests/answer-coverage.test.ts',
            `    /* Two obsolete page-11 explanation blanks became deterministic true/false\n       checks, leaving 135 intentionally reviewed open-ended targets. */\n    expect(Object.keys(REVIEWED_OPEN_ENDED_TARGET_SIGNATURES)).toHaveLength(135);`,
            `    /* Page 11 became deterministic and page 12 section ה replaced five\n       obsolete open-ended proximity targets with three exact targets. */\n    expect(Object.keys(REVIEWED_OPEN_ENDED_TARGET_SIGNATURES)).toHaveLength(130);`,
          );

          const marker = `  test('accepts the new exact coordinate proofs and rejects nearby values', () => {`;
          const addition = `  test('grades the replacement page-12 two-condition point exactly', () => {\n    const page = report.pages.find((candidate) => candidate.pageNumber === 12);\n    const targets = new Map(page?.targets.map((target) => [target.targetId, target] as const));\n    expect(page?.interactiveTargetCount).toBe(13);\n    expect(targets.get('p12-q11')?.automaticCheckingSafe).toBe(true);\n    expect(targets.get('p12-q11')?.answers).toEqual(['F', 'f']);\n    expect(targets.get('p12-q12')?.automaticCheckingSafe).toBe(true);\n    expect(targets.get('p12-q12')?.answers).toEqual(['8']);\n    expect(targets.get('p12-q13')?.automaticCheckingSafe).toBe(true);\n    expect(targets.get('p12-q13')?.answers).toEqual(['6']);\n  });\n\n`;
          replaceExact('tests/answer-coverage.test.ts', marker, addition + marker);
          NODE
      - run: npm run answers:coverage
      - name: Assert page 12 generated coverage
        run: |
          node <<'NODE'
          const report = require('./reports/answer-coverage.json');
          const page = report.pages.find((p) => p.pageNumber === 12);
          if (!page || page.interactiveTargetCount !== 13) throw new Error('Page 12 target count is not 13');
          const byId = Object.fromEntries(page.targets.map((t) => [t.targetId, t]));
          for (const [id, expected] of [['p12-q11','F'], ['p12-q12','8'], ['p12-q13','6']]) {
            const t = byId[id];
            if (!t?.automaticCheckingSafe || !t.answers.includes(expected)) {
              throw new Error(`${id} is not safely graded as ${expected}`);
            }
          }
          console.log(`Page 12 coverage: ${page.automaticallyCheckableTargets}/${page.interactiveTargetCount}`);
          NODE
      - name: Commit synced artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lms/provenAnswerKey.ts src/lms/answerCoverage.ts src/data/solutions/registry.ts tests/answer-coverage.test.ts reports/answer-coverage.json reports/answer-coverage.md reports/answer-target-order.json public/answer-review-manifest.json
          git commit -m "fix: sync page 12 grading and teacher solution"
          git push
