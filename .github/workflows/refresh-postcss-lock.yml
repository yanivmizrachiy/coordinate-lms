name: Refresh PostCSS lock

on:
  push:
    branches:
      - agent/sync-latest-workbook
    paths:
      - .github/workflows/refresh-postcss-lock.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm install --save-dev --save-exact postcss@8.5.23
      - run: npm audit --audit-level=high
      - name: Commit refreshed dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "Update PostCSS to 8.5.23"
          git push origin HEAD:agent/sync-latest-workbook
