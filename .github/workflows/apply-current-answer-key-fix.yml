name: Apply current answer-key mapping fix

on:
  push:
    branches:
      - agent/canonical-lms-unified
    paths:
      - '.github/workflows/apply-current-answer-key-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/canonical-lms-unified
          fetch-depth: 0
      - name: Patch repository answer-key loading exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/lms/repository.ts')
          text = path.read_text(encoding='utf-8')

          old_import = "import { DEFAULT_ANSWER_KEYS } from './answerKey';\n"
          new_import = "import { canonicalAnswerKeyForCurrentPage } from './currentAnswerKey';\n"
          old_proven_import = "import { provenAnswerKey } from './provenAnswerKey';\n"

          if text.count(old_import) != 1:
              raise SystemExit('expected exactly one DEFAULT_ANSWER_KEYS import')
          if text.count(old_proven_import) != 1:
              raise SystemExit('expected exactly one provenAnswerKey import')

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_proven_import, '', 1)

          old_block = """export async function loadAnswerKey(
            pageNumber: number,
          ): Promise<AnswerKey> {
            const implicit = implicitAnswerKey(pageNumber);
            const proven = provenAnswerKey(pageNumber);
            const defaults =
              DEFAULT_ANSWER_KEYS[pageNumber] || {};
            const local =
              parseJson<AnswerKey>(
                localStorage.getItem(
                  LOCAL_KEYS.answerKeyPrefix +
                    String(pageNumber),
                ),
                {},
              );

            const remote =
              centralAvailable() &&
              currentSession()?.role === 'teacher'
                ? await readRemoteAnswerKey(pageNumber)
                : {};

            return {
              ...implicit,
              ...proven,
              ...defaults,
              ...local,
              ...remote,
            };
          }
          """

          new_block = """export async function loadAnswerKey(
            pageNumber: number,
          ): Promise<AnswerKey> {
            const canonical =
              canonicalAnswerKeyForCurrentPage(pageNumber);
            const implicit = implicitAnswerKey(pageNumber);
            const local =
              parseJson<AnswerKey>(
                localStorage.getItem(
                  LOCAL_KEYS.answerKeyPrefix +
                    String(pageNumber),
                ),
                {},
              );

            const remote =
              centralAvailable() &&
              currentSession()?.role === 'teacher'
                ? await readRemoteAnswerKey(pageNumber)
                : {};

            return {
              ...canonical,
              ...implicit,
              ...local,
              ...remote,
            };
          }
          """

          if text.count(old_block) != 1:
              raise SystemExit('expected exactly one legacy loadAnswerKey block')
          text = text.replace(old_block, new_block, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- src/lms/repository.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lms/repository.ts
          git commit -m 'Fix runtime answer-key mapping for current workbook'
          git push origin HEAD:agent/canonical-lms-unified
