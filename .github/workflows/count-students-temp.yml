name: Count registered students (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/count-students-temp.yml'

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    env:
      FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Count students in Firestore
        shell: bash
        run: |
          if [[ -z "$FIREBASE_PROJECT_ID" || -z "$FIREBASE_SERVICE_ACCOUNT" ]]; then
            echo "::error::Firebase credentials are unavailable"
            exit 1
          fi
          npm install --no-save --ignore-scripts firebase-admin@13.5.0 >/dev/null 2>&1
          node --input-type=module <<'NODE'
          import { initializeApp, cert } from 'firebase-admin/app';
          import { getFirestore } from 'firebase-admin/firestore';

          const serviceAccount = JSON.parse(process.env.FIREBASE_SERVICE_ACCOUNT);
          const app = initializeApp({
            credential: cert(serviceAccount),
            projectId: process.env.FIREBASE_PROJECT_ID,
          });
          const snapshot = await getFirestore(app).collection('students').get();
          const registeredStudents = snapshot.docs.filter((doc) => doc.data().role !== 'admin').length;
          const adminRecords = snapshot.docs.filter((doc) => doc.data().role === 'admin').length;
          console.log(`REGISTERED_STUDENTS=${registeredStudents}`);
          console.log(`ADMIN_RECORDS=${adminRecords}`);
          console.log(`TOTAL_STUDENTS_COLLECTION_DOCS=${snapshot.size}`);
          NODE
