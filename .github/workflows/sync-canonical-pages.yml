name: Synchronize canonical workbook pages

on:
  push:
    branches:
      - agent/sync-latest-workbook

permissions:
  contents: write

jobs:
  synchronize-pages:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/sync-latest-workbook
      - name: Read the canonical workbook repository
        run: git clone --depth 1 https://github.com/yanivmizrachiy/coordinate-first-quadrant.git /tmp/coordinate-first-quadrant
      - name: Replace page source files with the canonical versions
        shell: bash
        run: |
          rm -f src/data/workbook/pages/*.ts
          cp /tmp/coordinate-first-quadrant/src/data/workbook/pages/*.ts src/data/workbook/pages/
      - name: Commit canonical page content
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/workbook/pages
          if git diff --cached --quiet; then
            echo "Page sources already match the canonical workbook."
          else
            git commit -m "sync: import all canonical workbook page sources"
            git push origin HEAD:agent/sync-latest-workbook
          fi
